<!DOCTYPE html>
<html>
<head>
    <title>Clear Demo Data</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { background: #059669; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #047857; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>Clear Demo Data</h1>
    <p>This will clear all items, services, discussions, comments, rentals, bookings, reviews, and messages from the database.</p>
    <p><strong>Warning:</strong> This action cannot be undone. Users and communities will be preserved.</p>
    <button onclick="clearData()">Clear Demo Data</button>
    <div id="result"></div>

    <script>
        async function clearData() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('result').innerHTML = '<div class="error">Please log in to the app first.</div>';
                return;
            }

            if (!confirm('Are you sure you want to clear all demo data? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch('https://api.vicinityshare.com/api/communities/clear-demo-data', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('result').innerHTML = `<div class="success">${data.detail}</div>`;
                } else {
                    const error = await response.json();
                    document.getElementById('result').innerHTML = `<div class="error">Error: ${error.detail}</div>`;
                }
            } catch (e) {
                document.getElementById('result').innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
